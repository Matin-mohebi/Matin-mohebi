name: MatinAI Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "MatinAIAndroid/**"
      - ".github/workflows/matinai-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APKs
        working-directory: MatinAIAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MatinAI-APK
          path: |
            MatinAIAndroid/app/build/outputs/apk/release/*.apk
            MatinAIAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
