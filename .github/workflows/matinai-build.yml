name: MatinAI Build & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - "MatinAIAndroid/**"
      - "MatinAIWeb/**"
      - "MatinAIDesktop/**"
      - "MatinAIiOS/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matinai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------- Android APK ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build APKs
        working-directory: MatinAIAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MatinAI-APK
          path: |
            MatinAIAndroid/app/build/outputs/apk/release/*.apk
            MatinAIAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------- Desktop (Windows / Linux — Electron) ----------------
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wine (embeds icon/metadata into the Windows exe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 > /dev/null 2>&1 && echo "wine-ok" || echo "wine missing — NSIS target will be skipped"
      - name: Build Electron desktop apps
        working-directory: MatinAIDesktop
        run: |
          npm ci
          npm run copy-ui
          if command -v wine > /dev/null 2>&1; then
            npx electron-builder --win nsis zip --linux AppImage zip --publish never
          else
            npx electron-builder --win zip --linux AppImage zip --config.win.signAndEditExecutable=false --publish never
          fi
      - name: Collect artifacts
        run: |
          mkdir -p out-desktop
          cd MatinAIDesktop/dist
          cp "Matin AI Setup "*.exe "$GITHUB_WORKSPACE/out-desktop/MatinAI-Windows-Setup-x64.exe" 2>/dev/null || true
          cp "Matin AI-"*-win.zip "$GITHUB_WORKSPACE/out-desktop/MatinAI-Windows-x64.zip"
          cp "Matin AI-"*.AppImage "$GITHUB_WORKSPACE/out-desktop/MatinAI-Linux-x64.AppImage"
          cp matin-ai-*.zip "$GITHUB_WORKSPACE/out-desktop/MatinAI-Linux-x64.zip"
          ls -la "$GITHUB_WORKSPACE/out-desktop/"
      - uses: actions/upload-artifact@v4
        with:
          name: MatinAI-Desktop
          path: out-desktop/*
          if-no-files-found: error
          retention-days: 30

  # ---------------- iOS IPA + macOS desktop (Electron, unsigned) ----------------
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh web assets
        run: |
          cd MatinAIiOS
          rm -rf www && mkdir www
          cp -r ../MatinAIWeb/. www/
      - name: Sync Capacitor iOS
        working-directory: MatinAIiOS
        run: |
          npm ci
          npx cap sync ios
      - name: Build unsigned .app (xcodebuild archive)
        working-directory: MatinAIiOS/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/MatinAI.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload out
          cp -r "$GITHUB_WORKSPACE/build/MatinAI.xcarchive/Products/Applications/App.app" "Payload/Matin AI.app"
          zip -qry "out/MatinAI-iOS-unsigned.ipa" Payload
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: MatinAI-iOS
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Build macOS desktop (Electron, unsigned)
        working-directory: MatinAIDesktop
        run: |
          npm ci
          npm run copy-ui
          CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac zip --publish never
          mkdir -p "$GITHUB_WORKSPACE/out-desktop-mac"
          cp dist/*-mac.zip "$GITHUB_WORKSPACE/out-desktop-mac/"
      - uses: actions/upload-artifact@v4
        with:
          name: MatinAI-Desktop-mac
          path: out-desktop-mac/*
          if-no-files-found: error
          retention-days: 30

  # ---------------- Web → GitHub Pages ----------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: MatinAIWeb

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------- Release (on version tags) ----------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, desktop, ios ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip web app for release
        run: zip -qr MatinAI-Web.zip MatinAIWeb
      - name: Collect files
        run: |
          mkdir out
          cp artifacts/MatinAI-APK/*.apk out/ 2>/dev/null || true
          cp artifacts/MatinAI-Desktop/* out/ 2>/dev/null || true
          cp artifacts/MatinAI-Desktop-mac/* out/ 2>/dev/null || true
          cp artifacts/MatinAI-iOS/*.ipa out/ 2>/dev/null || true
          cp MatinAI-Web.zip out/
          ls -la out/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Matin AI $GITHUB_REF_NAME — همه‌پلتفرم (Android · Windows · Linux · macOS · iOS · Web) | All Platforms" \
            --generate-notes
